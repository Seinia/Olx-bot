[project]
name = "olx-monitor"
version = "0.1.0"
description = "Мониторинг новых объявлений olx.ua с уведомлениями в Telegram"
requires-python = ">=3.11"
dependencies = [
    # Версии закреплены точно, а не диапазоном. Причина в первой строке: без подмены
    # TLS-отпечатка CloudFront отдаёт 403 на любой запрос к olx.ua, то есть доступ
    # к данным целиком зависит от одной способности curl_cffi. Смена её поведения
    # по умолчанию в новой версии убьёт мониторинг, и по логам это будет неотличимо
    # от блокировки со стороны OLX.
    "curl_cffi==0.15.0",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "aiogram==3.30.0",
    "loguru==0.7.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
